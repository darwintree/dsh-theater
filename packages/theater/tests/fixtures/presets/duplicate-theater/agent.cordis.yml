- id: stages
  name: '@darwintree/dsh-stage/preset'
  config:
    stages:
      board1:
        machine: test-game
- id: performance
  name: '@darwintree/dsh-theater/preset'
  config:
    characters:
      black:
        systemPrompt: You are the black test Character.
        tools:
          - factory: test-place-stone
            params: { stage: board1, color: black }
- id: first-director
  name: '../../plugins/test-game-director.js'
  config: { stage: board1, instruction: Make one legal move. }
- id: second-director
  name: '../../plugins/test-game-director.js'
  config: { stage: board1, instruction: Make one legal move. }
