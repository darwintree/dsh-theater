- id: stages
  name: '@darwintree/dsh-stage/preset'
  config:
    stages:
      board1:
        machine: gomoku
- id: performance
  name: '@darwintree/dsh-theater/preset'
  config:
    characters:
      black:
        systemPrompt: You are the black Gomoku test Character.
        tools:
          - factory: gomoku-place-stone
            params: { stage: board1, color: black }
- id: first-director
  name: '@darwintree/dsh-theater-gomoku/director'
  config: { stage: board1, instruction: Make one legal move. }
- id: second-director
  name: '@darwintree/dsh-theater-gomoku/director'
  config: { stage: board1, instruction: Make one legal move. }
