- id: stages
  name: '@darwintree/dsh-stage/preset'
  config:
    stages:
      board1:
        machine: gomoku
        params: { boardSize: 3, winLength: 3 }
- id: performance
  name: '@darwintree/dsh-theater/preset'
  config:
    characters:
      black:
        systemPrompt: You are the black Gomoku test Character.
        tools:
          - factory: gomoku-place-stone
            params: { stage: board1, color: black }
- id: director
  name: '../../plugins/complete-director.js'
