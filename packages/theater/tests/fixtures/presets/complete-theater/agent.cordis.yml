- id: stages
  name: '@darwintree/dsh-stage/preset'
  config:
    stages:
      board1:
        machine: test-game
        params: { boardSize: 3, target: 5 }
- id: performance
  name: '@darwintree/dsh-theater/preset'
  config:
    characters:
      black:
        systemPrompt: You are the black test Character.
        tools:
          - factory: test-place-stone
            params: { stage: board1, color: black }
- id: director
  name: '../../plugins/complete-director.js'
