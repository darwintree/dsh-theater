- id: stages
  name: '../../../../../stage/dist/preset.js'
  config:
    stages:
      board1:
        machine: gomoku
        params:
          boardSize: 3
          winLength: 3
- id: performance
  name: '../../../../dist/preset.js'
  config:
    characters:
      black:
        systemPrompt: You are the black Gomoku test Character.
        tools:
          - factory: gomoku-read-board
            params: { stage: board1 }
          - factory: gomoku-place-stone
            params: { stage: board1, color: black }
      white:
        systemPrompt: You are the white Gomoku test Character.
        tools:
          - factory: gomoku-place-stone
            params: { stage: board1, color: white }
- id: director
  name: '../../../../../theater-gomoku/dist/director.js'
  config:
    stage: board1
