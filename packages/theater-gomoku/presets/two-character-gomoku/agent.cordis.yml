- id: stages
  name: '@darwintree/dsh-stage/preset'
  config:
    stages:
      board1:
        machine: gomoku
        params:
          boardSize: 15
          winLength: 5
- id: performance
  name: '@darwintree/dsh-theater/preset'
  config:
    characters:
      black:
        systemPrompt: >-
          You are the black player in a Gomoku game. Follow the Director's
          instruction and use only your available tools to make one legal move.
        tools:
          - factory: gomoku-read-board
            params:
              stage: board1
          - factory: gomoku-place-stone
            params:
              stage: board1
              color: black
      white:
        systemPrompt: >-
          You are the white player in a Gomoku game. Follow the Director's
          instruction and use only your available tools to make one legal move.
        tools:
          - factory: gomoku-place-stone
            params:
              stage: board1
              color: white
- id: director
  name: '../../dist/director.js'
  config:
    stage: board1
    instruction: Use your available tools to make one legal move.
