packages:
  - packages/*
  - example/*
autoInstallPeers: true
dedupePeerDependents: true
resolvePeersFromWorkspaceRoot: true
overrides:
  '@deepseek-ai/cordis': '4.1.0'
  '@deepseek-ai/cordis-plugin-include': '1.1.0'
  '@deepseek-ai/cordis-plugin-loader': '1.1.0'
  '@deepseek-ai/schemastery': '3.19.0'
  '@deepseek-ai/dsh-app-boot': '0.2.2-rc.5'
  '@deepseek-ai/dsh-brand': '0.2.2-rc.5'
  '@deepseek-ai/dsh-config-editor': '0.2.2-rc.5'
  '@deepseek-ai/dsh-error': '0.2.2-rc.5'
  '@deepseek-ai/dsh-fs': '0.2.2-rc.5'
  '@deepseek-ai/dsh-fs-patch': '0.2.2-rc.5'
  '@deepseek-ai/dsh-home-paths': '0.2.2-rc.5'
  '@deepseek-ai/dsh-scope': '0.2.2-rc.5'
  '@deepseek-ai/dsh-session-format': '0.2.2-rc.5'
  '@deepseek-ai/dsh-session-format-catalog': '0.2.2-rc.5'
  '@deepseek-ai/dsh-session-format-v3-to-v4': '0.2.2-rc.5'
  '@deepseek-ai/dsh-session-projection': '0.2.2-rc.5'
  '@deepseek-ai/dsh-settings': '0.2.2-rc.5'
  '@deepseek-ai/dsh-storage': '0.2.2-rc.5'
  '@deepseek-ai/dsh-storage-domain': '0.2.2-rc.5'
  '@deepseek-ai/dsh-timeout': '0.2.2-rc.5'
  '@deepseek-ai/dsh-typert-protocol': '0.2.2-rc.5'
  '@deepseek-ai/dsh-user-approval': '0.2.2-rc.5'
  '@deepseek-ai/dsh-util-crypto': '0.2.2-rc.5'
  '@deepseek-ai/dsh-util-values': '0.2.2-rc.5'
  '@deepseek-ai/dsh-working-directory': '0.2.2-rc.5'
  '@deepseek-ai/dsh-workspace': '0.2.2-rc.5'
allowBuilds:
  esbuild: true
  # koffi is only loaded on Windows for MoveFileExW; skipping its native build avoids GCC build failures.
  koffi: false
  node-addon-require-builtin: false
